<svg viewBox="0 0 620 250" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, monospace">
  <rect width="100%" height="100%" fill="#FAFAF6"/>
  <!-- terminali -->
  <line x1="20" y1="120" x2="130" y2="120" stroke="#16202B" stroke-width="2.5"/>
  <line x1="490" y1="120" x2="600" y2="120" stroke="#16202B" stroke-width="2.5"/>
  <circle cx="20" cy="120" r="4" fill="#16202B"/>
  <circle cx="600" cy="120" r="4" fill="#16202B"/>
  <!-- corpo -->
  <rect x="130" y="65" width="150" height="110" fill="rgba(176,68,42,.14)" stroke="#B0442A" stroke-width="2"/>
  <rect x="280" y="65" width="60"  height="110" fill="#EDEFE9" stroke="#8A93A0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="340" y="65" width="150" height="110" fill="rgba(31,98,136,.14)" stroke="#1F6288" stroke-width="2"/>
  <!-- lettere -->
  <text x="195" y="118" font-size="34" font-weight="700" fill="#B0442A">P</text>
  <text x="400" y="118" font-size="34" font-weight="700" fill="#1F6288">N</text>
  <text x="150" y="152" font-size="11" fill="#B0442A">lacune = maggioritari</text>
  <text x="360" y="152" font-size="11" fill="#1F6288">elettroni = maggioritari</text>
  <text x="150" y="90" font-size="11" fill="#B0442A">droganti trivalenti</text>
  <text x="360" y="90" font-size="11" fill="#1F6288">droganti pentavalenti</text>
  <!-- ioni fissi nella zona di svuotamento -->
  <text x="292" y="103" font-size="15" fill="#B0442A">–  –</text>
  <text x="292" y="128" font-size="15" fill="#B0442A">–  –</text>
  <text x="292" y="153" font-size="15" fill="#B0442A">–  –</text>
  <text x="316" y="103" font-size="15" fill="#1F6288">+  +</text>
  <text x="316" y="128" font-size="15" fill="#1F6288">+  +</text>
  <text x="316" y="153" font-size="15" fill="#1F6288">+  +</text>
  <!-- campo interno -->
  <line x1="322" y1="196" x2="288" y2="196" stroke="#16202B" stroke-width="1.6"/>
  <polygon points="288,196 296,192 296,200" fill="#16202B"/>
  <text x="248" y="215" font-size="11" fill="#16202B">campo elettrico interno E₀ — barriera V₀ ≈ 0,7 V</text>
  <!-- richiami -->
  <line x1="310" y1="65" x2="310" y2="40" stroke="#8A93A0" stroke-width="1"/>
  <text x="222" y="33" font-size="11.5" fill="#5D6B78">giunzione PN · regione di svuotamento</text>
  <text x="26" y="107" font-size="12.5" font-weight="700" fill="#16202B">ANODO (A)</text>
  <text x="497" y="107" font-size="12.5" font-weight="700" fill="#16202B">CATODO (K)</text>
  <text x="26" y="240" font-size="11" fill="#5D6B78">contatto ohmico</text>
  <text x="497" y="240" font-size="11" fill="#5D6B78">contatto ohmico</text>
  <line x1="60" y1="228" x2="60" y2="132" stroke="#8A93A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="540" y1="228" x2="540" y2="132" stroke="#8A93A0" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
