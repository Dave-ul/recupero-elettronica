<svg viewBox="0 0 620 210" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, monospace">
  <rect width="100%" height="100%" fill="#FAFAF6"/>
  <line x1="110" y1="115" x2="255" y2="115" stroke="#16202B" stroke-width="2.5"/>
  <line x1="333" y1="115" x2="500" y2="115" stroke="#16202B" stroke-width="2.5"/>
  <polygon points="255,84 255,146 331,115" fill="#16202B"/>
  <line x1="331" y1="84" x2="331" y2="146" stroke="#16202B" stroke-width="5"/>
  <circle cx="110" cy="115" r="4.5" fill="#16202B"/>
  <circle cx="500" cy="115" r="4.5" fill="#16202B"/>
  <text x="96" y="98" font-size="14" font-weight="700" fill="#B0442A">A</text>
  <text x="494" y="98" font-size="14" font-weight="700" fill="#1F6288">K</text>
  <!-- corrente -->
  <line x1="150" y1="70" x2="210" y2="70" stroke="#B0442A" stroke-width="2.2"/>
  <polygon points="212,70 202,65 202,75" fill="#B0442A"/>
  <text x="160" y="58" font-size="13" font-weight="700" fill="#B0442A">I_D</text>
  <text x="222" y="74" font-size="11" fill="#B0442A">verso concorde con il triangolo</text>
  <!-- tensione -->
  <line x1="150" y1="115" x2="150" y2="170" stroke="#5D6B78" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="460" y1="115" x2="460" y2="170" stroke="#5D6B78" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="150" y1="170" x2="460" y2="170" stroke="#1F6288" stroke-width="2"/>
  <polygon points="150,170 160,165 160,175" fill="#1F6288"/>
  <text x="140" y="192" font-size="16" font-weight="700" fill="#1F6288">+</text>
  <text x="454" y="192" font-size="16" font-weight="700" fill="#1F6288">–</text>
  <text x="278" y="192" font-size="13" font-weight="700" fill="#1F6288">V_D = V_A – V_K</text>
  <text x="110" y="30" font-size="11.5" fill="#5D6B78">Convenzione degli UTILIZZATORI: la corrente entra dal morsetto a potenziale maggiore</text>
</svg>
