<svg viewBox="0 0 620 250" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, monospace">
  <rect width="100%" height="100%" fill="#FAFAF6"/>
  <text x="18" y="22" font-size="12" font-weight="700" fill="#16202B">LIMITATORE A BASSA SOGLIA (un solo diodo — limitazione unilaterale a +V_γ)</text>
  <!-- ingresso -->
  <circle cx="34" cy="90" r="4" fill="#16202B"/>
  <text x="16" y="76" font-size="11" fill="#5D6B78">v_i</text>
  <line x1="34" y1="90" x2="86" y2="90" stroke="#16202B" stroke-width="2"/>
  <rect x="86" y="78" width="56" height="24" fill="#fff" stroke="#16202B" stroke-width="2"/>
  <text x="104" y="70" font-size="10.5" fill="#16202B">R</text>
  <line x1="142" y1="90" x2="272" y2="90" stroke="#16202B" stroke-width="2"/>
  <circle cx="200" cy="90" r="3.4" fill="#16202B"/>
  <!-- diodo verticale punta in giù -->
  <line x1="200" y1="90" x2="200" y2="118" stroke="#16202B" stroke-width="2"/>
  <polygon points="186,118 214,118 200,142" fill="#B0442A"/>
  <line x1="186" y1="142" x2="214" y2="142" stroke="#B0442A" stroke-width="4.5"/>
  <line x1="200" y1="142" x2="200" y2="176" stroke="#16202B" stroke-width="2"/>
  <line x1="188" y1="176" x2="212" y2="176" stroke="#16202B" stroke-width="2"/>
  <line x1="192" y1="182" x2="208" y2="182" stroke="#16202B" stroke-width="1.6"/>
  <line x1="196" y1="188" x2="204" y2="188" stroke="#16202B" stroke-width="1.4"/>
  <text x="222" y="128" font-size="10.5" fill="#B0442A">D</text>
  <circle cx="272" cy="90" r="4" fill="#16202B"/>
  <text x="278" y="76" font-size="11" fill="#5D6B78">v_o</text>
  <text x="18" y="216" font-size="10.5" fill="#5D6B78">|v_i| &lt; V_γ  → D interdetto → nessuna corrente in R → v_o = v_i</text>
  <text x="18" y="232" font-size="10.5" fill="#5D6B78">v_i &gt; V_γ  → D conduce  → v_o bloccata a V_γ, l'eccesso cade su R</text>

  <line x1="316" y1="16" x2="316" y2="240" stroke="#D8DCD6" stroke-width="1.5"/>

  <!-- forme d'onda -->
  <line x1="344" y1="120" x2="602" y2="120" stroke="#16202B" stroke-width="1.4"/>
  <line x1="352" y1="40" x2="352" y2="200" stroke="#16202B" stroke-width="1.4"/>
  <text x="342" y="34" font-size="10" fill="#5D6B78">v</text>
  <text x="594" y="136" font-size="10" fill="#5D6B78">t</text>
  <!-- soglia -->
  <line x1="352" y1="102" x2="602" y2="102" stroke="#B0442A" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="556" y="98" font-size="10" fill="#B0442A">+V_γ</text>
  <!-- ingresso tratteggiato -->
  <path d="M 352 120 Q 383 46 414 120 Q 445 194 476 120 Q 507 46 538 120 Q 569 194 600 120"
        fill="none" stroke="#8A93A0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- uscita: clipping sopra +Vg -->
  <path d="M 352 120 Q 360 102 366 102 L 400 102 Q 406 102 414 120 Q 445 194 476 120 Q 484 102 490 102 L 524 102 Q 530 102 538 120 Q 569 194 600 120"
        fill="none" stroke="#B0442A" stroke-width="2.6"/>
  <text x="392" y="218" font-size="10" fill="#B0442A">v_o (continuo)</text>
  <text x="486" y="218" font-size="10" fill="#8A93A0">v_i (tratteggio)</text>
</svg>
