<svg viewBox="0 0 620 270" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, monospace">
  <rect width="100%" height="100%" fill="#FAFAF6"/>
  <!-- ===== SERIE ===== -->
  <text x="18" y="22" font-size="11.5" font-weight="700" fill="#16202B">DIODI IN SERIE — soglia = n · V_γ</text>
  <circle cx="30" cy="72" r="4" fill="#16202B"/>
  <text x="14" y="60" font-size="10.5" fill="#5D6B78">v_i</text>
  <line x1="30" y1="72" x2="70" y2="72" stroke="#16202B" stroke-width="2"/>
  <rect x="70" y="61" width="50" height="22" fill="#fff" stroke="#16202B" stroke-width="2"/>
  <text x="86" y="54" font-size="10" fill="#16202B">R</text>
  <line x1="120" y1="72" x2="248" y2="72" stroke="#16202B" stroke-width="2"/>
  <circle cx="170" cy="72" r="3.2" fill="#16202B"/>
  <!-- 3 diodi in serie verso massa -->
  <line x1="170" y1="72" x2="170" y2="88" stroke="#16202B" stroke-width="2"/>
  <polygon points="158,88 182,88 170,106" fill="#B0442A"/>
  <line x1="158" y1="106" x2="182" y2="106" stroke="#B0442A" stroke-width="4"/>
  <line x1="170" y1="106" x2="170" y2="122" stroke="#16202B" stroke-width="2"/>
  <polygon points="158,122 182,122 170,140" fill="#B0442A"/>
  <line x1="158" y1="140" x2="182" y2="140" stroke="#B0442A" stroke-width="4"/>
  <line x1="170" y1="140" x2="170" y2="156" stroke="#16202B" stroke-width="2"/>
  <polygon points="158,156 182,156 170,174" fill="#B0442A"/>
  <line x1="158" y1="174" x2="182" y2="174" stroke="#B0442A" stroke-width="4"/>
  <line x1="170" y1="174" x2="170" y2="196" stroke="#16202B" stroke-width="2"/>
  <line x1="158" y1="196" x2="182" y2="196" stroke="#16202B" stroke-width="2"/>
  <line x1="162" y1="202" x2="178" y2="202" stroke="#16202B" stroke-width="1.6"/>
  <line x1="166" y1="208" x2="174" y2="208" stroke="#16202B" stroke-width="1.4"/>
  <text x="192" y="98" font-size="10" fill="#B0442A">D1</text>
  <text x="192" y="132" font-size="10" fill="#B0442A">D2</text>
  <text x="192" y="166" font-size="10" fill="#B0442A">D3</text>
  <circle cx="248" cy="72" r="4" fill="#16202B"/>
  <text x="252" y="60" font-size="10.5" fill="#5D6B78">v_o</text>
  <text x="18" y="238" font-size="10.5" fill="#5D6B78">La conduzione inizia solo quando v_i &gt; 3·V_γ ≈ 2,1 V:</text>
  <text x="18" y="254" font-size="10.5" fill="#5D6B78">le cadute dei tre diodi si sommano → soglia più alta.</text>

  <line x1="296" y1="16" x2="296" y2="262" stroke="#D8DCD6" stroke-width="1.5"/>

  <!-- ===== ANTIPARALLELO ===== -->
  <text x="322" y="22" font-size="11.5" font-weight="700" fill="#16202B">DIODI IN ANTIPARALLELO — soglia ± V_γ</text>
  <circle cx="332" cy="72" r="4" fill="#16202B"/>
  <text x="316" y="60" font-size="10.5" fill="#5D6B78">v_i</text>
  <line x1="332" y1="72" x2="372" y2="72" stroke="#16202B" stroke-width="2"/>
  <rect x="372" y="61" width="50" height="22" fill="#fff" stroke="#16202B" stroke-width="2"/>
  <text x="388" y="54" font-size="10" fill="#16202B">R</text>
  <line x1="422" y1="72" x2="560" y2="72" stroke="#16202B" stroke-width="2"/>
  <circle cx="478" cy="72" r="3.2" fill="#16202B"/>
  <line x1="478" y1="72" x2="478" y2="96" stroke="#16202B" stroke-width="2"/>
  <line x1="444" y1="96" x2="512" y2="96" stroke="#16202B" stroke-width="2"/>
  <!-- ramo sx: diodo punta in giù -->
  <line x1="444" y1="96" x2="444" y2="112" stroke="#16202B" stroke-width="2"/>
  <polygon points="432,112 456,112 444,130" fill="#B0442A"/>
  <line x1="432" y1="130" x2="456" y2="130" stroke="#B0442A" stroke-width="4"/>
  <line x1="444" y1="130" x2="444" y2="158" stroke="#16202B" stroke-width="2"/>
  <!-- ramo dx: diodo punta in su -->
  <line x1="512" y1="96" x2="512" y2="112" stroke="#16202B" stroke-width="2"/>
  <line x1="500" y1="112" x2="524" y2="112" stroke="#1F6288" stroke-width="4"/>
  <polygon points="500,130 524,130 512,112" fill="#1F6288"/>
  <line x1="512" y1="130" x2="512" y2="158" stroke="#16202B" stroke-width="2"/>
  <line x1="444" y1="158" x2="512" y2="158" stroke="#16202B" stroke-width="2"/>
  <line x1="478" y1="158" x2="478" y2="180" stroke="#16202B" stroke-width="2"/>
  <line x1="466" y1="180" x2="490" y2="180" stroke="#16202B" stroke-width="2"/>
  <line x1="470" y1="186" x2="486" y2="186" stroke="#16202B" stroke-width="1.6"/>
  <line x1="474" y1="192" x2="482" y2="192" stroke="#16202B" stroke-width="1.4"/>
  <text x="410" y="124" font-size="10" fill="#B0442A">D1</text>
  <text x="532" y="124" font-size="10" fill="#1F6288">D2</text>
  <circle cx="560" cy="72" r="4" fill="#16202B"/>
  <text x="564" y="60" font-size="10.5" fill="#5D6B78">v_o</text>
  <text x="322" y="222" font-size="10.5" fill="#5D6B78">Semionda positiva → conduce D1 → v_o = +V_γ</text>
  <text x="322" y="238" font-size="10.5" fill="#5D6B78">Semionda negativa → conduce D2 → v_o = –V_γ</text>
  <text x="322" y="254" font-size="10.5" fill="#5D6B78">Limitazione SIMMETRICA su entrambe le polarità.</text>
</svg>
